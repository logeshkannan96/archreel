name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm validate:examples
      - name: JSON Schema is up to date
        run: pnpm schema:json && git diff --exit-code packages/schema/archreel.schema.json

  render:
    # Pinned OS: Linux visual goldens depend on its font rasterization.
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Chrome Headless Shell dependencies (remotion.dev/docs/miscellaneous/linux-dependencies)
        run: >
          sudo apt-get update && sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0
          libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1
          libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - run: pnpm install --frozen-lockfile
      # Missing Linux goldens are written and skipped; they're uploaded below to commit.
      - run: pnpm test:visual
      - name: Render examples
        run: |
          for name in url-shortener rate-limiter kafka-fanout; do
            node packages/cli/dist/bin.js render "examples/$name.yaml" -o "out/$name.gif"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-gifs
          path: out/*.gif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-goldens-linux
          path: packages/cli/visual/linux/
          if-no-files-found: ignore
