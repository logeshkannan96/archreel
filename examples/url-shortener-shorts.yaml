# yaml-language-server: $schema=../packages/schema/archreel.schema.json
version: 1
canvas: { width: 1080, height: 1920, fps: 30 } # 9:16 Short: flows top to bottom

nodes:
  - { id: client, label: Client, icon: user }
  - { id: alb, label: ALB, icon: aws/alb }
  - { id: api, label: API, icon: server, group: vpc }
  - { id: redis, label: Redis, icon: redis, group: vpc }
  - { id: pg, label: Postgres, icon: postgres, group: vpc }

groups:
  - { id: vpc, label: VPC }

edges:
  - { from: client, to: alb }
  - { from: alb, to: api }
  - { from: api, to: redis }
  - { from: api, to: pg }

steps:
  - reveal: [client, alb, api]
  - flow: { from: client, to: alb, label: "GET /abc123" }
    duration: 1.2s
  - flow: { from: alb, to: api }
  - flow: { from: api, to: redis, label: GET abc123 }
  - fail: { node: redis, effect: shake, label: cache miss }
  - flow: { from: api, to: pg, label: SELECT }
  - highlight: { nodes: [pg], caption: Source of truth }
  - flow: { from: api, to: alb, label: 301 Redirect }
  - flow: { from: alb, to: client }
  - pause: 1s
